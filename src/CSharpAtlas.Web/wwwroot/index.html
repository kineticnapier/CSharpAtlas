<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>C# Atlas</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/playground-inline.css">
</head>
<body>
<header>
  <div class="nav">
    <button class="logo" id="homeButton">C<span>#</span> Atlas</button>
    <nav>
      <button data-nav-type="all">すべて</button>
      <button data-nav-type="code">コード集</button>
      <button data-nav-type="exception">例外</button>
      <button data-nav-type="compiler">CSエラー</button>
      <button id="playgroundNavButton">プレイグラウンド</button>
    </nav>
  </div>
</header>

<main>
  <section id="homeView">
    <div class="hero">
      <div class="eyebrow">逆引き C# リファレンス</div>
      <h1>やりたいことも、<br>壊れた理由も。</h1>
      <p>C# のコード例、例外、コンパイルエラー、仕組みをひとつの検索で。</p>
      <form id="searchForm" class="search">
        <input id="searchInput" placeholder="例: JSON 読み込み / NullReferenceException / CS0103" autocomplete="off">
        <button type="submit">検索</button>
      </form>
      <div class="quick">
        <button data-query="JSON">JSON</button>
        <button data-query="Dictionary">Dictionary</button>
        <button data-query="null">null</button>
        <button data-query="CS0103">CS0103</button>
      </div>
    </div>

    <div class="layout">
      <aside>
        <div class="aside-title">種類</div>
        <button class="type active" data-type="all">すべて</button>
        <button class="type" data-type="code">コード集</button>
        <button class="type" data-type="exception">例外</button>
        <button class="type" data-type="compiler">コンパイル</button>
        <button class="type" data-type="logic">論理エラー</button>
        <button class="type" data-type="concept">仕組み</button>
      </aside>

      <section>
        <div class="list-head">
          <h2 id="listTitle">おすすめ</h2>
          <span id="resultCount"></span>
        </div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty">一致する項目がありません。</div>
      </section>
    </div>
  </section>

  <section id="detailView" class="detail hidden">
    <button id="backButton" class="back">← 一覧に戻る</button>
    <div id="detailContent"></div>
  </section>
</main>

<section id="playgroundPanel" class="terminal-panel" aria-label="C# Playground">
  <div class="terminal-tabs">
    <button id="playgroundToggle" class="terminal-tab active" type="button">PLAYGROUND</button>
    <span class="terminal-tab-label">問題</span>
    <span class="terminal-tab-label">出力</span>
    <span class="terminal-tab-label">デバッグ コンソール</span>
    <div class="terminal-spacer"></div>
    <span id="compileStatus" class="compile-status">未実行</span>
    <button id="terminalCollapseButton" class="terminal-icon-button" type="button" aria-label="パネルを閉じる">⌄</button>
  </div>

  <div class="terminal-body">
    <div class="terminal-editor-pane">
      <div class="terminal-pane-head">
        <strong>Program.cs</strong>
        <div class="panel-actions">
          <button id="resetButton" class="secondary-button">初期化</button>
          <button id="compileButton" class="primary-button">コンパイル</button>
        </div>
      </div>
      <textarea id="codeInput" class="terminal-editor" spellcheck="false" aria-label="C# code editor"></textarea>
    </div>

    <div class="terminal-output-pane">
      <div class="terminal-pane-head"><strong>診断</strong></div>
      <div id="diagnostics" class="diagnostics-empty">Ctrl+Enter または「コンパイル」で診断します。</div>
    </div>
  </div>
</section>

<button id="playgroundFab" class="playground-fab" type="button" aria-label="プレイグラウンドを開く">&lt;/&gt;</button>

<script src="/app.js"></script>
<script src="/playground.js"></script>
</body>
</html>
