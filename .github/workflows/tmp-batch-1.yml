              summary: 'ZipArchive exposes each archive entry as a stream. In create mode, [[idisposable|Dispose]] finalizes directory metadata, so finish the archive before reopening its bytes for reading.',
              why: 'Entries can be handled independently through streams, which allows inspection or generation without requiring filesystem extraction.',
              tips: 'When extracting an external archive, separately validate entry paths and bound total expanded data.',
              tags: ['ZipArchive', 'ZIP', 'Stream']
            },
            'json-document': {
              title: 'Inspecting variable JSON shapes with JsonDocument',
              short: 'Check JsonElement kinds and optional properties while reading JSON dynamically.',
              summary: 'JsonDocument provides a read-only JSON tree. Its JsonElement values normally borrow document-owned storage, so keep the [[idisposable|JsonDocument lifetime]] explicit.',
              why: 'Elements are tied to their document unless Clone creates an independent JsonElement that may outlive the owner.',
              tips: 'Use TryGetProperty and ValueKind before reading a value instead of assuming every input has one fixed shape.',
              tags: ['JsonDocument', 'JsonElement', 'JSON']
            }
          };

          const existing = new Set(base.map(article => article.id));
          for (const entry of entries) {
            if (existing.has(entry.id) || ja[entry.id] || en[entry.id])
              throw new Error(`Refusing duplicate batch entry: ${entry.id}`);
            base.push(entry);
            ja[entry.id] = jaEntries[entry.id];
            en[entry.id] = enEntries[entry.id];
          }

          await writeFile(basePath, JSON.stringify(base, null, 2) + '\n');
          await writeFile(jaPath, JSON.stringify(ja, null, 2) + '\n');
          await writeFile(enPath, JSON.stringify(en, null, 2) + '\n');
          NODE
          node /tmp/add-batch1.mjs
