              why: 'Path.Combine は区切り文字をプラットフォームに合わせ、Path.GetFullPath は . や .. を含むパスを絶対パスへ正規化します。',
              tips: '正規化はファイルの存在確認やシンボリックリンク解決ではありません。外部入力では基準外へ出ないことも別に検証します。',
