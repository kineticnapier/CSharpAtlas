name: Temporary roomier graph cards

on:
  push:
    branches:
      - feature/article-graph

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/article-graph
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enlarge graph cards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/graph-view.js')
          text = path.read_text()
          replacements = {
              "const BASE_CARD = { width: 188, height: 92 };": "const BASE_CARD = { width: 320, height: 160 };",
              "const SELECTED_CARD = { width: 232, height: 122 };": "const SELECTED_CARD = { width: 400, height: 220 };",
              "width: clamp(world.width * scale, 132, 280),": "width: clamp(world.width * scale, 180, 420),",
              "height: clamp(world.height * scale, 78, 150)": "height: clamp(world.height * scale, 100, 230)",
              "width: clamp(world.width * scale, 12, 220),": "width: clamp(world.width * scale, 16, 340),",
              "height: clamp(world.height * scale, 7, 116)": "height: clamp(world.height * scale, 8, 180)"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify
        run: |
          npm install
          npm test
          npm run build
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/temp-roomier-graph-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/graph-view.js test/article-graph.test.js .github/workflows/temp-roomier-graph-cards.yml
          git commit -m "fix: enlarge graph article cards"
          git push origin HEAD:feature/article-graph
