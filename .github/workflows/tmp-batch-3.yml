name: Temporary content batch 3

on:
  push:
    branches:
      - codex/content-expand-300

permissions:
  contents: write

jobs:
  batch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-expand-300
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare acceptance check
        run: |
          cat > /tmp/accept-batch3.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';

          const content = path.resolve('public/content');
          const categories = [
            'items.json', 'exceptions.json', 'compiler-errors.json',
            'compiler-warnings.json', 'concepts.json', 'code-recipes.json',
            'logic-errors.json'
          ];
          const expectedIds = [
            'async-enumerable',
            'async-disposable',
            'linked-cancellation-tokens',
            'cancellation-registration',
            'task-completion-source',
            'value-task',
            'channel-producer-consumer',
            'parallel-for-each-async',
            'periodic-timer',
            'reader-writer-lock-slim',
            'debug-assert'
          ];

          const allBase = [];
          const jaIds = new Set();
          const enIds = new Set();
          for (const category of categories) {
            const base = JSON.parse(await readFile(path.join(content, 'articles', category), 'utf8'));
            const ja = JSON.parse(await readFile(path.join(content, 'locales', 'ja', category), 'utf8'));
            const en = JSON.parse(await readFile(path.join(content, 'locales', 'en', category), 'utf8'));
            const baseIds = base.map(article => article.id).sort();
            assert.deepEqual(Object.keys(ja).sort(), baseIds, `${category}: ja IDs`);
            assert.deepEqual(Object.keys(en).sort(), baseIds, `${category}: en IDs`);
            allBase.push(...base);
            for (const id of Object.keys(ja)) jaIds.add(id);
            for (const id of Object.keys(en)) enIds.add(id);
          }

          assert.equal(new Set(allBase.map(article => article.id)).size, allBase.length, 'unique base IDs');
          assert.equal(allBase.length, 300, 'cumulative corpus total');
          const ids = new Set(allBase.map(article => article.id));
          for (const id of expectedIds) {
            assert.ok(ids.has(id), `missing base article: ${id}`);
            assert.ok(jaIds.has(id), `missing ja article: ${id}`);
            assert.ok(enIds.has(id), `missing en article: ${id}`);
          }
          console.log('Batch 3 accepted: 11 articles; 300 cumulative articles.');
          NODE
      - name: RED - verify the 11 articles are absent
        run: |
          if node /tmp/accept-batch3.mjs > /tmp/red.out 2>&1; then
            cat /tmp/red.out
            echo 'Acceptance unexpectedly passed before implementation.'
            exit 1
          fi
          cat /tmp/red.out
          grep -Eq '300|missing base article' /tmp/red.out
          echo 'RED confirmed: acceptance fails before implementation.'
      - name: Add the 11 articles
        run: |
          cat > /tmp/add-batch3.mjs <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const basePath = 'public/content/articles/code-recipes.json';
          const jaPath = 'public/content/locales/ja/code-recipes.json';
          const enPath = 'public/content/locales/en/code-recipes.json';

          const base = JSON.parse(await readFile(basePath, 'utf8'));
          const ja = JSON.parse(await readFile(jaPath, 'utf8'));
          const en = JSON.parse(await readFile(enPath, 'utf8'));

          const entries = [
            {
              id: 'async-enumerable', type: 'code', bad: null, good: null,
              code: `using System.Runtime.CompilerServices;\n\nusing var cts = new CancellationTokenSource(TimeSpan.FromSeconds(2));\n\nawait foreach (int value in CountAsync(cts.Token))\n    Console.WriteLine(value);\n\nstatic async IAsyncEnumerable<int> CountAsync(\n    [EnumeratorCancellation] CancellationToken token = default)\n{\n    for (int i = 1; i <= 3; i++)\n    {\n        await Task.Delay(100, token);\n        yield return i;\n    }\n}`,
              related: ['async-await', 'cancellation-token', 'ienumerable']
            },
            {
              id: 'async-disposable', type: 'code', bad: null, good: null,
              code: `string path = Path.GetTempFileName();\ntry\n{\n    await using var stream = new FileStream(\n        path, FileMode.Create, FileAccess.Write, FileShare.None,\n        bufferSize: 4096, useAsync: true);\n\n    await stream.WriteAsync(new byte[] { 1, 2, 3 });\n}\nfinally\n{\n    File.Delete(path);\n}`,
              related: ['idisposable', 'file-async', 'finally-cleanup']
            },
            {
              id: 'linked-cancellation-tokens', type: 'code', bad: null, good: null,
              code: `CancellationToken callerToken = CancellationToken.None;\nusing var timeout = new CancellationTokenSource(TimeSpan.FromSeconds(5));\nusing var linked = CancellationTokenSource.CreateLinkedTokenSource(\n    callerToken, timeout.Token);\n\ntry\n{\n    await Task.Delay(TimeSpan.FromSeconds(1), linked.Token);\n}\ncatch (OperationCanceledException) when (linked.IsCancellationRequested)\n{\n    Console.WriteLine(\"Canceled by caller or timeout.\");\n}`,
              related: ['cancellation-token', 'operation-canceled', 'task-delay']
            },
            {
              id: 'cancellation-registration', type: 'code', bad: null, good: null,
              code: `using var cts = new CancellationTokenSource();\nCancellationToken token = cts.Token;\n\nusing CancellationTokenRegistration registration = token.Register(\n    static state => Console.WriteLine($\"Cancel callback: {state}\"),\n    \"cleanup requested\");\n\ncts.Cancel();\nConsole.WriteLine(token.IsCancellationRequested);`,
              related: ['cancellation-token', 'idisposable', 'linked-cancellation-tokens']
            },
            {
              id: 'task-completion-source', type: 'code', bad: null, good: null,
              code: `var completion = new TaskCompletionSource<int>(\n    TaskCreationOptions.RunContinuationsAsynchronously);\n\nTask<int> resultTask = completion.Task;\ncompletion.TrySetResult(42);\n\nint result = await resultTask;\nConsole.WriteLine(result);`,
              related: ['task', 'async-await', 'task-whenall']
            },
            {
              id: 'value-task', type: 'code', bad: null, good: null,
              code: `ValueTask<int> lengthTask = GetLengthAsync(\"CSharpAtlas\");\nint length = await lengthTask;\nConsole.WriteLine(length);\n\nstatic ValueTask<int> GetLengthAsync(string text)\n{\n    if (text.Length < 100)\n        return ValueTask.FromResult(text.Length);\n\n    return new ValueTask<int>(Task.Run(() => text.Length));\n}`,
              related: ['task', 'async-await', 'task-run-cpu']
            },
            {
              id: 'channel-producer-consumer', type: 'code', bad: null, good: null,
              code: `using System.Threading.Channels;\n\nChannel<int> channel = Channel.CreateBounded<int>(capacity: 2);\n\nTask producer = Task.Run(async () =>\n{\n    for (int i = 1; i <= 3; i++)\n        await channel.Writer.WriteAsync(i);\n\n    channel.Writer.Complete();\n});\n\nawait foreach (int item in channel.Reader.ReadAllAsync())\n    Console.WriteLine(item);\n\nawait producer;`,
              related: ['async-enumerable', 'task', 'semaphore-async']
            },
            {
              id: 'parallel-for-each-async', type: 'code', bad: null, good: null,
              code: `using var cts = new CancellationTokenSource(TimeSpan.FromSeconds(5));\n\nawait Parallel.ForEachAsync(\n    Enumerable.Range(1, 4),\n    cts.Token,\n    async (item, token) =>\n    {\n        await Task.Delay(100, token);\n        Console.WriteLine(item);\n    });`,
              related: ['async-await', 'cancellation-token', 'task-run-cpu']
            },
            {
              id: 'periodic-timer', type: 'code', bad: null, good: null,
              code: `using var timer = new PeriodicTimer(TimeSpan.FromMilliseconds(200));\nusing var cts = new CancellationTokenSource(TimeSpan.FromSeconds(2));\n\nint ticks = 0;\nwhile (ticks < 3 && await timer.WaitForNextTickAsync(cts.Token))\n{\n    ticks++;\n    Console.WriteLine($\"tick {ticks}\");\n}`,
              related: ['task-delay', 'cancellation-token', 'idisposable']
            },
            {
              id: 'reader-writer-lock-slim', type: 'code', bad: null, good: null,
              code: `using var gate = new ReaderWriterLockSlim();\nint value = 0;\n\ngate.EnterWriteLock();\ntry\n{\n    value++;\n}\nfinally\n{\n    gate.ExitWriteLock();\n}\n\ngate.EnterReadLock();\ntry\n{\n    Console.WriteLine(value);\n}\nfinally\n{\n    gate.ExitReadLock();\n}`,
              related: ['lock-shared-state', 'finally-cleanup', 'idisposable']
            },
            {
              id: 'debug-assert', type: 'code', bad: null, good: null,
              code: `using System.Diagnostics;\n\nstatic int Average(int total, int count)\n{\n    Debug.Assert(count > 0, \"count must be positive\");\n    return total / count;\n}\n\nConsole.WriteLine(Average(10, 2));`,
              related: ['argument-out-of-range', 'divide-by-zero', 'custom-exceptions']
            }
          ];

          const jaEntries = {
            'async-enumerable': {
              title: 'IAsyncEnumerable<T> を await foreach で逐次処理する',
              short: '非同期に届く複数の値を await foreach で1件ずつ受け取る。',
              summary: 'IAsyncEnumerable<T> は値の列を非同期に生成できます。[[async-await|async/await]] と通常の IEnumerable の中間のように、全件が揃う前から処理を始められます。',
              why: 'MoveNext 相当の待機を非同期化できるため、I/O を伴うストリーミング処理でスレッドをブロックせずに次の値を待てます。',
              tips: 'キャンセル可能にするなら CancellationToken を列挙処理へ伝播させ、生成側でも待機 API に渡します。',
              tags: ['IAsyncEnumerable', 'await foreach', 'async']
            },
            'async-disposable': {
              title: 'await using で非同期リソースを破棄する',
              short: 'IAsyncDisposable を実装するリソースを await using で確実に後始末する。',
              summary: '非同期の後始末を必要とするリソースでは await using を使います。これは [[idisposable|using]] の非同期版で、スコープ終了時に DisposeAsync を待機します。',
              why: 'バッファのフラッシュや非同期 I/O の終了処理を同期的に待つ代わりに、破棄処理そのものを await できます。',
              tips: 'await using の外側で別の後始末が必要なら finally と組み合わせ、破棄順序を明確にします。',
              tags: ['IAsyncDisposable', 'await using', 'cleanup']
            },
            'linked-cancellation-tokens': {
              title: '複数のキャンセル条件を1つにまとめる',
              short: 'CreateLinkedTokenSource で呼び出し元キャンセルとタイムアウトを合成する。',
              summary: '呼び出し元の [[cancellation-token|CancellationToken]] と内部タイムアウトのどちらでも止めたい場合、linked token source で1つのトークンにまとめられます。',
              why: 'リンクされた CancellationTokenSource は元のどれかがキャンセルされると自身もキャンセル状態になります。',
              tips: 'linked source も IDisposable なので using で破棄し、不要になった登録を残さないようにします。',
              tags: ['CancellationTokenSource', 'cancellation', 'timeout']
            },
            'cancellation-registration': {
              title: 'キャンセル時のコールバックを登録する',
              short: 'CancellationToken.Register でキャンセル通知に処理を結び付ける。',
              summary: 'ポーリングだけでなく CancellationToken.Register でキャンセル時の処理を登録できます。通常の [[cancellation-token|CancellationToken]] と同じ協調キャンセルの仕組みです。',
              why: 'Register はキャンセル要求を受けたタイミングでコールバックを呼び出すため、待機中の外部状態へ通知したい場合に使えます。',
              tips: '登録は CancellationTokenRegistration として破棄できるので、長寿命トークンへ不要なコールバックを残さないようにします。',
              tags: ['CancellationToken', 'Register', 'callback']
            },
            'task-completion-source': {
              title: 'TaskCompletionSource で外部イベントを Task に変換する',
              short: '自分で Task の完了・失敗・キャンセルを通知する。',
              summary: 'TaskCompletionSource<T> はコールバック型 API などの完了通知を [[task|Task]] として公開したいときに使います。呼び出し側は通常どおり await できます。',
              why: 'Task の状態を外部イベントから明示的に遷移させる橋渡し役になり、待つ側と完了させる側を分離できます。',
              tips: 'ライブラリコードでは RunContinuationsAsynchronously を使うと、完了通知を行ったスレッド上で継続処理が直接走るリスクを減らせます。',
              tags: ['TaskCompletionSource', 'Task', 'async']
            },
            'value-task': {
              title: 'ValueTask<T> を必要な場面だけ使う',
              short: '同期完了が非常に多い非同期 API で ValueTask<T> を検討する。',
              summary: 'ValueTask<T> は結果が同期的に得られることが多い高頻度 API で割り当てを減らせる場合がありますが、通常は [[task|Task<T>]] の方が単純です。',
              why: 'ValueTask<T> 自体が値型なので、常に新しい Task オブジェクトを必要としないケースがあります。',
              tips: '同じ ValueTask を複数回 await するなど Task と同じ感覚で保存・再利用しないでください。性能上の根拠がある場合に限定します。',
              tags: ['ValueTask', 'Task', 'performance']
            },
            'channel-producer-consumer': {
              title: 'Channel<T> で producer / consumer をつなぐ',
              short: '非同期で安全なキューを使い、生成側と消費側を分離する。',
              summary: 'System.Threading.Channels の Channel<T> は非同期 producer / consumer 用のキューです。Reader.ReadAllAsync は [[async-enumerable|IAsyncEnumerable<T>]] として読み取れます。',
              why: 'bounded channel では容量上限に達した producer を非同期に待機させられ、共有 List を自前ロックするより契約を明確にできます。',
              tips: 'producer が終了したら Writer.Complete を呼び、consumer が終端を検出できるようにします。',
              tags: ['Channel', 'producer consumer', 'async']
            },
            'parallel-for-each-async': {
              title: 'Parallel.ForEachAsync で複数の非同期処理を並行実行する',
              short: '複数要素への非同期処理を並行化し、キャンセルも伝播させる。',
              summary: 'Parallel.ForEachAsync は要素ごとの非同期処理を並行実行します。各処理へ [[cancellation-token|CancellationToken]] が渡されるので待機 API に伝播できます。',
              why: '単純な foreach + await は逐次処理ですが、この API は並行度を管理しながら複数要素を進められます。',
              tips: '並行化すれば必ず速くなるわけではありません。共有状態・外部サービスの制限・処理コストを確認して使います。',
              tags: ['Parallel.ForEachAsync', 'concurrency', 'async']
            },
            'periodic-timer': {
              title: 'PeriodicTimer で一定間隔の非同期処理を行う',
              short: '次の時刻を非同期に待ち、キャンセル可能な周期処理を作る。',
              summary: 'PeriodicTimer は次の tick を await できるタイマーです。[[task-delay|Task.Delay]] を自前ループするより周期処理の意図を表しやすくなります。',
              why: 'WaitForNextTickAsync が非同期待機を提供し、CancellationToken と組み合わせて終了条件を明示できます。',
              tips: '処理時間が周期より長い場合の挙動を理解し、厳密なリアルタイムスケジューラとしては扱わないでください。',
              tags: ['PeriodicTimer', 'timer', 'async']
            },
            'reader-writer-lock-slim': {
              title: 'ReaderWriterLockSlim で読み取りと書き込みを分ける',
              short: '読み取り共有・書き込み排他のロックを try/finally で扱う。',
              summary: 'ReaderWriterLockSlim は複数 reader を許しつつ writer を排他にできます。単純な共有状態ならまず [[lock-shared-state|lock]] を検討し、必要性がある場合に使います。',
              why: '読み取りの多いワークロードでは reader 同士を同時実行できますが、ロック管理は通常の lock より複雑です。',
              tips: 'Enter 系を呼んだら必ず try/finally で対応する Exit を呼びます。ロックを保持したまま await しないでください。',
              tags: ['ReaderWriterLockSlim', 'lock', 'concurrency']
            },
            'debug-assert': {
              title: 'Debug.Assert で開発中の前提条件を検査する',
              short: 'プログラム内部で常に成り立つはずの条件をデバッグ時に確認する。',
              summary: 'Debug.Assert は開発中の不変条件を確認するための診断手段です。外部入力の検証や [[argument-out-of-range|ArgumentOutOfRangeException]] の代わりにはなりません。',
              why: 'assert は「ここに来た時点で成立しているはず」という内部前提の破れを開発時に見つける用途に向いています。',
              tips: '利用者が起こし得る入力エラーには通常の条件分岐と例外を使い、Debug.Assert に依存して安全性を保たないでください。',
              tags: ['Debug.Assert', 'diagnostics', 'invariant']
            }
          };

          const enEntries = {
            'async-enumerable': {
              title: 'Streaming asynchronous values with IAsyncEnumerable<T>',
              short: 'Consume values one at a time with await foreach as they arrive asynchronously.',
              summary: 'IAsyncEnumerable<T> produces a sequence asynchronously. It combines [[async-await|async/await]] style waiting with sequence processing so work can start before every value exists.',
              why: 'Advancing the sequence can await I/O instead of blocking a thread while the next item is unavailable.',
              tips: 'For cooperative cancellation, propagate a CancellationToken through enumeration and into the awaited operations in the producer.',
              tags: ['IAsyncEnumerable', 'await foreach', 'async']
            },
            'async-disposable': {
              title: 'Disposing asynchronous resources with await using',
              short: 'Use await using when cleanup itself may need asynchronous work.',
              summary: 'await using is the asynchronous counterpart of [[idisposable|using]]. It awaits DisposeAsync when the scope exits.',
              why: 'Resources that flush buffers or finish asynchronous I/O during cleanup can release them without synchronously blocking the caller.',
              tips: 'Combine await using with finally when additional cleanup outside the resource lifetime is required, and keep disposal order explicit.',
              tags: ['IAsyncDisposable', 'await using', 'cleanup']
            },
            'linked-cancellation-tokens': {
              title: 'Combining multiple cancellation conditions',
              short: 'Link caller cancellation and an internal timeout into one token source.',
              summary: 'When an operation should stop for either caller cancellation or an internal timeout, CreateLinkedTokenSource combines both with the normal [[cancellation-token|CancellationToken]] model.',
              why: 'The linked CancellationTokenSource becomes canceled when any of its source tokens is canceled.',
              tips: 'Dispose the linked source with using so registrations against longer-lived source tokens do not remain unnecessarily.',
              tags: ['CancellationTokenSource', 'cancellation', 'timeout']
            },
            'cancellation-registration': {
              title: 'Registering callbacks for cancellation',
              short: 'Use CancellationToken.Register when another component must be notified on cancellation.',
              summary: 'CancellationToken.Register attaches a callback to the same cooperative cancellation signal used by [[cancellation-token|CancellationToken]] checks and cancellable waits.',
              why: 'The callback runs when cancellation is requested, which can bridge cancellation into an API that needs explicit notification.',
              tips: 'Dispose the returned CancellationTokenRegistration when it is no longer needed, especially when the source token is long-lived.',
              tags: ['CancellationToken', 'Register', 'callback']
            },
            'task-completion-source': {
              title: 'Bridging external completion into Task with TaskCompletionSource',
              short: 'Expose callback or event completion as an awaitable Task.',
              summary: 'TaskCompletionSource<T> lets one side control completion while callers observe an ordinary [[task|Task<T>]] and await it.',
              why: 'It separates the producer of a completion signal from consumers that want the Task-based asynchronous model.',
              tips: 'For library code, RunContinuationsAsynchronously can reduce surprises from continuations running inline on the thread that completes the source.',
              tags: ['TaskCompletionSource', 'Task', 'async']
            },
            'value-task': {
              title: 'Using ValueTask<T> only when it is justified',
              short: 'Consider ValueTask<T> for very hot APIs that complete synchronously most of the time.',
              summary: 'ValueTask<T> can avoid some allocations when results are often immediately available, but ordinary [[task|Task<T>]] is simpler and should remain the default.',
              why: 'Because ValueTask<T> is a value type, some successful synchronous paths do not require allocating a new Task object.',
              tips: 'Do not casually store or await the same ValueTask multiple times. Use it only with a measured reason and understand the consumption rules.',
              tags: ['ValueTask', 'Task', 'performance']
            },
            'channel-producer-consumer': {
              title: 'Connecting producers and consumers with Channel<T>',
              short: 'Use an asynchronous queue to decouple producers from consumers safely.',
              summary: 'System.Threading.Channels provides queues designed for asynchronous producer/consumer flows. Reader.ReadAllAsync exposes items as an [[async-enumerable|IAsyncEnumerable<T>]].',
              why: 'A bounded channel can asynchronously apply backpressure when capacity is full instead of requiring a manually locked shared List.',
              tips: 'Complete the writer when production is finished so consumers can observe the end of the stream.',
              tags: ['Channel', 'producer consumer', 'async']
            },
            'parallel-for-each-async': {
              title: 'Running asynchronous per-item work with Parallel.ForEachAsync',
              short: 'Process multiple items concurrently while propagating cancellation.',
              summary: 'Parallel.ForEachAsync can run asynchronous work for several elements concurrently and supplies a [[cancellation-token|CancellationToken]] to each iteration.',
              why: 'A plain foreach with await is sequential, while this API manages concurrent iterations for workloads that benefit from overlap.',
              tips: 'Concurrency is not automatically faster. Account for shared state, service rate limits, and the actual cost of each operation.',
              tags: ['Parallel.ForEachAsync', 'concurrency', 'async']
            },
            'periodic-timer': {
              title: 'Running periodic asynchronous work with PeriodicTimer',
              short: 'Await timer ticks instead of blocking a thread for recurring work.',
              summary: 'PeriodicTimer provides an awaitable next-tick operation. It expresses periodic work more directly than a hand-written [[task-delay|Task.Delay]] loop.',
              why: 'WaitForNextTickAsync supports asynchronous waiting and cancellation without dedicating a blocked thread to the timer.',
              tips: 'Understand what happens when the work takes longer than the period; this is not a hard real-time scheduler.',
              tags: ['PeriodicTimer', 'timer', 'async']
            },
            'reader-writer-lock-slim': {
              title: 'Separating read and write locking with ReaderWriterLockSlim',
              short: 'Allow concurrent readers while keeping writers exclusive, with explicit try/finally cleanup.',
              summary: 'ReaderWriterLockSlim can allow multiple readers while excluding writers. Prefer simpler [[lock-shared-state|lock]] for ordinary shared state unless the extra complexity has a clear benefit.',
              why: 'Read-heavy workloads may permit reader concurrency, but lock management is more complex than a normal monitor lock.',
              tips: 'Pair every successful Enter call with Exit in finally, and do not hold this lock across await.',
              tags: ['ReaderWriterLockSlim', 'lock', 'concurrency']
            },
            'debug-assert': {
              title: 'Checking development-time invariants with Debug.Assert',
              short: 'Document and detect conditions that should already be true inside the program.',
              summary: 'Debug.Assert is a diagnostic tool for internal invariants. It is not a replacement for validating external input or throwing [[argument-out-of-range|ArgumentOutOfRangeException]].',
              why: 'Assertions are useful for detecting violations of assumptions that indicate a programming defect rather than an expected user error.',
              tips: 'Use normal checks and exceptions for invalid input that callers can produce; do not rely on Debug.Assert for runtime safety.',
              tags: ['Debug.Assert', 'diagnostics', 'invariant']
            }
          };

          const existing = new Set(base.map(article => article.id));
          for (const entry of entries) {
            if (existing.has(entry.id) || ja[entry.id] || en[entry.id])
              throw new Error(`Refusing duplicate batch entry: ${entry.id}`);
            base.push(entry);
            ja[entry.id] = jaEntries[entry.id];
            en[entry.id] = enEntries[entry.id];
          }

          await writeFile(basePath, JSON.stringify(base, null, 2) + '\n');
          await writeFile(jaPath, JSON.stringify(ja, null, 2) + '\n');
          await writeFile(enPath, JSON.stringify(en, null, 2) + '\n');
          NODE
          node /tmp/add-batch3.mjs
      - name: GREEN - verify batch acceptance
        run: node /tmp/accept-batch3.mjs
      - name: Run tests
        run: npm test
      - name: Build
