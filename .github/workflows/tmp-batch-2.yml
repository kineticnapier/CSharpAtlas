name: Temporary content batch 2

on:
  push:
    branches:
      - codex/content-expand-300

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-expand-300
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare acceptance check
        run: |
          cat > /tmp/accept-batch2.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';

          const content = path.resolve('public/content');
          const categories = [
            'items.json', 'exceptions.json', 'compiler-errors.json',
            'compiler-warnings.json', 'concepts.json', 'code-recipes.json',
            'logic-errors.json'
          ];
          const expectedIds = [
            'json-serializer-options',
            'json-naming-policy',
            'json-enum-converter',
            'json-ignore-null',
            'httpclient-lifetime',
            'http-request-headers',
            'http-json-request',
            'http-json-response',
            'uri-builder',
            'form-url-encoded-content',
            'multipart-form-data'
          ];

          const allBase = [];
          const jaIds = new Set();
          const enIds = new Set();
          for (const category of categories) {
            const base = JSON.parse(await readFile(path.join(content, 'articles', category), 'utf8'));
            const ja = JSON.parse(await readFile(path.join(content, 'locales', 'ja', category), 'utf8'));
            const en = JSON.parse(await readFile(path.join(content, 'locales', 'en', category), 'utf8'));
            const baseIds = base.map(article => article.id).sort();
            assert.deepEqual(Object.keys(ja).sort(), baseIds, `${category}: ja IDs`);
            assert.deepEqual(Object.keys(en).sort(), baseIds, `${category}: en IDs`);
            allBase.push(...base);
            for (const id of Object.keys(ja)) jaIds.add(id);
            for (const id of Object.keys(en)) enIds.add(id);
          }
          assert.equal(new Set(allBase.map(article => article.id)).size, allBase.length, 'unique base IDs');
          assert.equal(allBase.length, 289, 'cumulative corpus total');
          const ids = new Set(allBase.map(article => article.id));
          for (const id of expectedIds) {
            assert.ok(ids.has(id), `missing base article: ${id}`);
            assert.ok(jaIds.has(id), `missing ja article: ${id}`);
            assert.ok(enIds.has(id), `missing en article: ${id}`);
          }
          console.log('Batch 2 accepted: 11 articles; 289 cumulative articles.');
          NODE
      - name: RED - verify the 11 articles are absent
        run: |
          if node /tmp/accept-batch2.mjs > /tmp/red.out 2>&1; then
            cat /tmp/red.out
            echo 'Acceptance unexpectedly passed before implementation.'
            exit 1
          fi
          cat /tmp/red.out
          grep -Eq '289|missing base article' /tmp/red.out
          echo 'RED confirmed: acceptance fails before implementation.'
      - name: Add the 11 articles
        run: |
          cat > /tmp/add-batch2.mjs <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const basePath = 'public/content/articles/code-recipes.json';
          const jaPath = 'public/content/locales/ja/code-recipes.json';
          const enPath = 'public/content/locales/en/code-recipes.json';
          const base = JSON.parse(await readFile(basePath, 'utf8'));
          const ja = JSON.parse(await readFile(jaPath, 'utf8'));
          const en = JSON.parse(await readFile(enPath, 'utf8'));

          const entries = [
            {
              id: 'json-serializer-options', type: 'code', bad: null, good: null,
              code: `using System.Text.Json;\n\nvar options = new JsonSerializerOptions\n{\n    WriteIndented = true,\n    PropertyNameCaseInsensitive = true\n};\n\nstring json = JsonSerializer.Serialize(new User("Ada", 17), options);\nUser? user = JsonSerializer.Deserialize<User>(json, options);\nConsole.WriteLine(user?.Name);\n\nsealed record User(string Name, int Age);`,
              related: ['json-read', 'json-write', 'json-options-contracts']
            },
            {
              id: 'json-naming-policy', type: 'code', bad: null, good: null,
              code: `using System.Text.Json;\n\nvar options = new JsonSerializerOptions\n{\n    PropertyNamingPolicy = JsonNamingPolicy.CamelCase\n};\n\nstring json = JsonSerializer.Serialize(new Player("Ada", 120), options);\nConsole.WriteLine(json); // {"name":"Ada","score":120}\n\nsealed record Player(string Name, int Score);`,
              related: ['json-serializer-options', 'json-write']
            },
            {
              id: 'json-enum-converter', type: 'code', bad: null, good: null,
              code: `using System.Text.Json;\nusing System.Text.Json.Serialization;\n\nvar options = new JsonSerializerOptions();\noptions.Converters.Add(new JsonStringEnumConverter());\n\nstring json = JsonSerializer.Serialize(Status.Ready, options);\nStatus restored = JsonSerializer.Deserialize<Status>(json, options);\nConsole.WriteLine($"{json} -> {restored}");\n\nenum Status { Pending, Ready, Failed }`,
              related: ['json-serializer-options', 'enums-flags']
            },
            {
              id: 'json-ignore-null', type: 'code', bad: null, good: null,
              code: `using System.Text.Json;\nusing System.Text.Json.Serialization;\n\nvar options = new JsonSerializerOptions\n{\n    DefaultIgnoreCondition = JsonIgnoreCondition.WhenWritingNull\n};\n\nvar message = new Message("hello", null);\nConsole.WriteLine(JsonSerializer.Serialize(message, options));\n\nsealed record Message(string Text, string? Detail);`,
              related: ['json-serializer-options', 'nullable']
            },
            {
              id: 'httpclient-lifetime', type: 'code', bad: null, good: null,
              code: `sealed class ApiClient\n{\n    private static readonly HttpClient Http = new();\n\n    public async Task<string> GetTextAsync(Uri uri, CancellationToken token)\n    {\n        using HttpResponseMessage response = await Http.GetAsync(uri, token);\n        response.EnsureSuccessStatusCode();\n        return await response.Content.ReadAsStringAsync(token);\n    }\n}`,
              related: ['http-get', 'http-request-exception', 'cancellation-token']
            },
            {
              id: 'http-request-headers', type: 'code', bad: null, good: null,
              code: `using var client = new HttpClient();\nusing var request = new HttpRequestMessage(HttpMethod.Get, new Uri("https://example.test/"));\nrequest.Headers.UserAgent.ParseAdd("CSharpAtlas/1.0");\nrequest.Headers.Accept.ParseAdd("application/json");\n\nConsole.WriteLine(request.Headers.UserAgent);\nConsole.WriteLine(request.Headers.Accept);\n// Pass the prepared request to SendAsync when a real endpoint is available.`,
              related: ['http-get', 'httpclient-lifetime', 'uri-format']
            },
            {
              id: 'http-json-request', type: 'code', bad: null, good: null,
              code: `using System.Net.Http.Json;\n\nvar payload = new CreateUser("Ada", 17);\nusing JsonContent content = JsonContent.Create(payload);\nusing var request = new HttpRequestMessage(HttpMethod.Post, new Uri("https://example.test/users"))\n{\n    Content = content\n};\n\nConsole.WriteLine(request.Method);\nConsole.WriteLine(request.Content.Headers.ContentType);\n\nsealed record CreateUser(string Name, int Age);`,
              related: ['json-write', 'http-request-headers', 'uri-format']
            },
            {
              id: 'http-json-response', type: 'code', bad: null, good: null,
              code: `using System.Net;\nusing System.Net.Http.Json;\n\nusing var response = new HttpResponseMessage(HttpStatusCode.OK)\n{\n    Content = JsonContent.Create(new User("Ada", 17))\n};\n\nUser? user = await response.Content.ReadFromJsonAsync<User>();\nConsole.WriteLine(user?.Name);\n\nsealed record User(string Name, int Age);`,
              related: ['json-read', 'http-response-status', 'http-json-request']
            },
            {
              id: 'uri-builder', type: 'code', bad: null, good: null,
              code: `var builder = new UriBuilder("https", "example.com")\n{\n    Path = "api/search",\n    Query = "q=" + Uri.EscapeDataString("C# streams")\n};\n\nUri uri = builder.Uri;\nConsole.WriteLine(uri.AbsoluteUri);`,
              related: ['uri-format', 'http-get', 'encoding-text-bytes']
            },
            {
              id: 'form-url-encoded-content', type: 'code', bad: null, good: null,
              code: `var fields = new Dictionary<string, string>\n{\n    ["name"] = "Ada Lovelace",\n    ["language"] = "C#"\n};\n\nusing var content = new FormUrlEncodedContent(fields);\nstring body = await content.ReadAsStringAsync();\nConsole.WriteLine(content.Headers.ContentType);\nConsole.WriteLine(body);`,
              related: ['http-request-headers', 'encoding-text-bytes']
            },
            {
              id: 'multipart-form-data', type: 'code', bad: null, good: null,
              code: `using var form = new MultipartFormDataContent();\nform.Add(new StringContent("Ada"), "name");\n\nbyte[] bytes = "hello"u8.ToArray();\nvar file = new ByteArrayContent(bytes);\nfile.Headers.ContentType = new System.Net.Http.Headers.MediaTypeHeaderValue("text/plain");\nform.Add(file, "file", "note.txt");\n\nConsole.WriteLine(form.Headers.ContentType);\nConsole.WriteLine(form.Count());`,
              related: ['http-request-headers', 'form-url-encoded-content', 'stream-basics']
            }
          ];

          const jaEntries = {
            'json-serializer-options': { title: 'JsonSerializerOptions を共有して JSON の契約をそろえる', short: 'シリアライズとデシリアライズで同じ JSON 設定を使う。', summary: 'JsonSerializerOptions にインデントや大文字小文字の扱いなどをまとめると、[[json-read|読み取り]]と[[json-write|書き込み]]で同じ契約を使えます。', why: '同じ型でもオプションが異なると、プロパティ名や変換方法など JSON との対応関係が変わるためです。', tips: '設定は処理ごとに場当たり的に作らず、アプリ内で意図した契約単位にまとめて再利用します。', tags: ['JSON', 'JsonSerializerOptions', '契約'] },
            'json-naming-policy': { title: 'JSON のプロパティ名を camelCase にする', short: 'JsonNamingPolicy で C# の名前と JSON の名前付け規則を分ける。', summary: 'PropertyNamingPolicy に CamelCase を指定すると、C# 側の PascalCase を JSON 側では camelCase にできます。設定は [[json-serializer-options|JsonSerializerOptions]] にまとめます。', why: 'C# の命名規則と外部 JSON の命名規則が異なっていても、モデルのプロパティ名を崩さず変換できるためです。', tips: '既存 API と接続するときは、相手側の契約に合わせて命名ポリシーや個別属性を選びます。', tags: ['JSON', 'camelCase', 'JsonNamingPolicy'] },
            'json-enum-converter': { title: 'enum を JSON の文字列として扱う', short: 'JsonStringEnumConverter で数値ではなく名前を読み書きする。', summary: 'JsonStringEnumConverter を登録すると enum を "Ready" のような文字列として表現できます。enum 自体の基本は [[enums-flags|enum と Flags]] と同じです。', why: '数値表現より読みやすくなる一方、名前の変更が外部 JSON の契約変更になり得ます。', tips: '保存形式や公開 API では、enum メンバー名の変更も互換性に影響するものとして扱います。', tags: ['JSON', 'enum', 'converter'] },
            'json-ignore-null': { title: 'JSON 出力から null プロパティを省く', short: 'JsonIgnoreCondition.WhenWritingNull で null の出力方針を設定する。', summary: 'DefaultIgnoreCondition を設定すると、[[nullable|nullable]] な値が null のとき JSON へ書き出すかどうかを一括で制御できます。', why: 'null を明示する契約と、プロパティ自体を省略する契約は意味が異なる場合があるため、意図的に選ぶ必要があります。', tips: '受信側が「欠落」と「null」を区別する API では、安易に省略しないでください。', tags: ['JSON', 'null', 'JsonIgnoreCondition'] },
            'httpclient-lifetime': { title: 'HttpClient を繰り返し利用する', short: 'リクエストごとに作り直さず、長寿命の HttpClient を使う。', summary: '繰り返し通信するクライアントでは HttpClient を再利用し、各レスポンスは必要に応じて破棄します。通信失敗は [[http-request-exception|HttpRequestException]] として扱います。', why: 'HttpClient は複数リクエストを送るためのクライアントで、毎回作成・破棄するより再利用する設計が基本です。', tips: '長い処理には CancellationToken を渡し、呼び出し側のキャンセル要求を伝播させます。', tags: ['HttpClient', 'HTTP', 'lifetime'] },
            'http-request-headers': { title: 'HTTP リクエストヘッダーを型付き API で設定する', short: 'User-Agent や Accept を HttpRequestMessage に設定する。', summary: 'HttpRequestMessage.Headers の型付きプロパティを使うと、文字列を手作業で連結せずヘッダーを構築できます。URI の妥当性は [[uri-format|URI の解析]] と別に考えます。', why: 'ヘッダーごとの構文規則を専用 API が検証し、リクエスト本体とメタデータを分けて扱えるためです。', tips: 'Content-Type は request.Headers ではなく、通常 request.Content.Headers に属します。', tags: ['HTTP', 'headers', 'HttpRequestMessage'] },
            'http-json-request': { title: 'JSON を本文に持つ HTTP リクエストを組み立てる', short: 'JsonContent でオブジェクトから JSON の HTTP Content を作る。', summary: 'JsonContent.Create はオブジェクトを JSON の HttpContent に変換します。シリアライズ自体は [[json-write|JSON 書き込み]]と同じ契約です。', why: '文字列を自前で組み立てず、Content-Type と JSON 変換を一緒に扱えるためです。', tips: '例はリクエストを組み立てるだけです。実送信時は HttpClient.SendAsync と CancellationToken を組み合わせます。', tags: ['HTTP', 'JSON', 'JsonContent'] },
            'http-json-response': { title: 'HTTP レスポンスの JSON を型として読む', short: 'ReadFromJsonAsync で JSON 本文を C# オブジェクトへ変換する。', summary: 'HttpContent.ReadFromJsonAsync を使うと JSON 本文を型へ変換できます。まず [[http-response-status|HTTP ステータス]]を確認してから本文を解釈する設計が重要です。', why: '成功時とエラー時で本文の形式が異なる API が多く、ステータスと JSON 変換を分けて考える必要があるためです。', tips: '外部 JSON では null や不足プロパティも想定し、戻り値を無条件に非 null と決めつけないようにします。', tags: ['HTTP', 'JSON', 'ReadFromJsonAsync'] },
            'uri-builder': { title: 'UriBuilder で URI の各要素を組み立てる', short: 'scheme・host・path・query を構造として扱う。', summary: 'UriBuilder を使うと URI 全体を文字列連結せずに構成できます。入力文字列の解析失敗については [[uri-format|UriFormatException]] も確認します。', why: 'URI の path と query ではエスケープ規則が異なるため、構造を意識して組み立てる方が安全です。', tips: 'クエリ値を埋め込む場合は値単位で適切にエスケープし、完成 URI 全体を二重エスケープしないようにします。', tags: ['UriBuilder', 'URI', 'query'] },
            'form-url-encoded-content': { title: 'フォーム形式の HTTP 本文を作る', short: 'FormUrlEncodedContent で key-value を application/x-www-form-urlencoded にする。', summary: 'FormUrlEncodedContent は key-value をフォーム URL エンコードされた本文へ変換し、Content-Type も設定します。文字列とバイト列の関係は [[encoding-text-bytes|Encoding]] とも関係します。', why: '空白や記号を含む値を含め、フォーム形式のエンコードをライブラリに任せられるためです。', tips: 'JSON API へ送る場合はこの形式ではなく、相手の契約に応じて JsonContent などを選びます。', tags: ['HTTP', 'form', 'FormUrlEncodedContent'] },
            'multipart-form-data': { title: 'multipart/form-data に文字列とファイルを入れる', short: 'MultipartFormDataContent で複数パートの本文を構成する。', summary: 'MultipartFormDataContent は文字列やバイト列など複数の HttpContent を1つの multipart 本文へまとめます。大きなファイルでは [[stream-basics|Stream]] を使う Content も検討します。', why: '各パートに名前・ファイル名・Content-Type を持たせられ、ファイルアップロード形式を構造的に作れるためです。', tips: '大容量データを ByteArrayContent に全読み込みするとメモリを使うため、必要なら StreamContent を使います。', tags: ['HTTP', 'multipart', 'file upload'] }
          };

          const enEntries = {
            'json-serializer-options': { title: 'Sharing JsonSerializerOptions for one JSON contract', short: 'Use the same JSON settings for serialization and deserialization.', summary: 'JsonSerializerOptions collects indentation, name matching, and other behavior so [[json-read|reading]] and [[json-write|writing]] follow the same contract.', why: 'Different options can change how the same C# type maps to property names and values in JSON.', tips: 'Create options around intentional contracts instead of constructing unrelated settings at each call site.', tags: ['JSON', 'JsonSerializerOptions', 'contract'] },
            'json-naming-policy': { title: 'Writing JSON property names in camelCase', short: 'Use JsonNamingPolicy to separate C# naming from JSON naming.', summary: 'PropertyNamingPolicy can map PascalCase C# properties to camelCase JSON while remaining part of the shared [[json-serializer-options|JsonSerializerOptions]] contract.', why: 'The C# model can follow C# naming conventions while external JSON follows a different naming convention.', tips: 'When integrating with an existing API, match its documented contract with a naming policy or explicit attributes.', tags: ['JSON', 'camelCase', 'JsonNamingPolicy'] },
            'json-enum-converter': { title: 'Representing enums as JSON strings', short: 'Use JsonStringEnumConverter to read and write enum names instead of numbers.', summary: 'JsonStringEnumConverter represents values such as Ready by name. The underlying type behavior is still the same as [[enums-flags|C# enums]].', why: 'String values are easier to inspect, but renaming an enum member can become a breaking change to persisted or public JSON.', tips: 'Treat enum member names as part of the external contract when they are serialized as strings.', tags: ['JSON', 'enum', 'converter'] },
            'json-ignore-null': { title: 'Omitting null properties from JSON output', short: 'Use JsonIgnoreCondition.WhenWritingNull to define null output behavior.', summary: 'DefaultIgnoreCondition controls whether [[nullable|nullable]] properties with null values are written or omitted from JSON.', why: 'A missing property and an explicitly present null can mean different things to another system.', tips: 'Do not omit nulls blindly when the receiving API distinguishes between missing and null values.', tags: ['JSON', 'null', 'JsonIgnoreCondition'] },
            'httpclient-lifetime': { title: 'Reusing HttpClient across requests', short: 'Keep a long-lived HttpClient instead of recreating one for every request.', summary: 'Clients that perform repeated HTTP calls should reuse HttpClient while disposing per-request responses as appropriate. Transport failures surface through [[http-request-exception|HttpRequestException]].', why: 'HttpClient is designed to send many requests and is normally better treated as a reusable client than a per-request object.', tips: 'Pass CancellationToken through long-running calls so cancellation remains cooperative.', tags: ['HttpClient', 'HTTP', 'lifetime'] },
            'http-request-headers': { title: 'Setting HTTP request headers with typed APIs', short: 'Configure User-Agent and Accept on HttpRequestMessage.', summary: 'Typed HttpRequestMessage.Headers APIs avoid manually concatenating header syntax. URI parsing remains a separate concern covered by [[uri-format|URI validation]].', why: 'Dedicated header APIs validate header-specific syntax and keep request metadata separate from the body.', tips: 'Content-Type usually belongs to request.Content.Headers rather than request.Headers.', tags: ['HTTP', 'headers', 'HttpRequestMessage'] },
            'http-json-request': { title: 'Building an HTTP request with a JSON body', short: 'Create JSON HttpContent from an object with JsonContent.', summary: 'JsonContent.Create turns an object into JSON HttpContent using the same serialization ideas as [[json-write|writing JSON]].', why: 'It avoids hand-building JSON strings while pairing the payload with an appropriate media type.', tips: 'The example only constructs a request. Real sending should use HttpClient.SendAsync with an appropriate CancellationToken.', tags: ['HTTP', 'JSON', 'JsonContent'] },
            'http-json-response': { title: 'Reading a JSON HTTP response into a type', short: 'Deserialize a response body with ReadFromJsonAsync.', summary: 'HttpContent.ReadFromJsonAsync converts JSON response content into a C# type. Check [[http-response-status|HTTP status]] before assuming the body has the success shape.', why: 'Many APIs return different body schemas for success and error responses, so status handling and deserialization are separate concerns.', tips: 'Treat external JSON as nullable or incomplete unless the contract guarantees otherwise.', tags: ['HTTP', 'JSON', 'ReadFromJsonAsync'] },
            'uri-builder': { title: 'Composing URI components with UriBuilder', short: 'Treat scheme, host, path, and query as URI structure instead of one concatenated string.', summary: 'UriBuilder constructs URI components without manually concatenating the entire URI. Invalid source text is still related to [[uri-format|UriFormatException]].', why: 'Paths and query values follow different escaping rules, so preserving URI structure helps avoid malformed strings.', tips: 'Escape individual query values where appropriate and avoid double-escaping the completed URI.', tags: ['UriBuilder', 'URI', 'query'] },
            'form-url-encoded-content': { title: 'Creating form-urlencoded HTTP content', short: 'Encode key-value fields as application/x-www-form-urlencoded.', summary: 'FormUrlEncodedContent converts key-value pairs into form URL encoded content and supplies the content type. The underlying text-to-byte conversion also relates to [[encoding-text-bytes|encoding]].', why: 'The library handles spaces and reserved characters according to the form encoding rules.', tips: 'Use this only when the endpoint expects form content; JSON endpoints should use a JSON content contract instead.', tags: ['HTTP', 'form', 'FormUrlEncodedContent'] },
            'multipart-form-data': { title: 'Combining fields and files as multipart/form-data', short: 'Use MultipartFormDataContent to assemble multiple content parts.', summary: 'MultipartFormDataContent combines strings, bytes, or other HttpContent values into one multipart body. For large files, consider a [[stream-basics|stream-backed]] content source.', why: 'Each part can carry its own name, filename, and Content-Type without manually constructing multipart boundaries.', tips: 'ByteArrayContent holds all bytes in memory; use StreamContent when the payload should remain streamed.', tags: ['HTTP', 'multipart', 'file upload'] }
          };

          const existing = new Set(base.map(article => article.id));
          for (const entry of entries) {
            if (existing.has(entry.id) || ja[entry.id] || en[entry.id])
              throw new Error(`Refusing duplicate batch entry: ${entry.id}`);
            base.push(entry);
            ja[entry.id] = jaEntries[entry.id];
            en[entry.id] = enEntries[entry.id];
          }

          await writeFile(basePath, JSON.stringify(base, null, 2) + '\n');
          await writeFile(jaPath, JSON.stringify(ja, null, 2) + '\n');
          await writeFile(enPath, JSON.stringify(en, null, 2) + '\n');
          NODE
          node /tmp/add-batch2.mjs
      - name: GREEN - verify batch acceptance
        run: node /tmp/accept-batch2.mjs
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/content/articles/code-recipes.json \
                  public/content/locales/ja/code-recipes.json \
                  public/content/locales/en/code-recipes.json
          git diff --cached --check
          git commit -m 'content: add json and http batch 2'
          git push origin HEAD:codex/content-expand-300
